name: Build & Release (Windows x86_64)

env:
  # 留空自动拉取最新 Release；如需锁版本可填写具体 tag（如 v5.16.1 / v2.11.2）
  MAAFW_VERSION: ""
  MXU_VERSION: ""

on:
  push:
    tags:
      - "v*"
    branches:
      - "main"
    paths:
      - "assets/**"
      - "tools/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "自定义版本号（留空则自动根据 Git 信息生成）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set_tag
        run: |
          is_release=false
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            is_release=true
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            tag="${{ github.event.inputs.version }}"
          else
            short_sha=$(git rev-parse --short HEAD)
            tag="v0.0.0-ci.$(date +%y%m%d)-${short_sha}"
          fi

          is_prerelease=false
          if [[ "$tag" =~ (alpha|beta|rc|dev|-ci) ]]; then
            is_prerelease=true
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$tag is_release=$is_release is_prerelease=$is_prerelease"

  package:
    needs: meta
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate PI V2 interface & pipelines
        run: python tools/validate.py

      - name: Download MaaFramework (win-x86_64)
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-win-x86_64-*.zip"
          latest: ${{ env.MAAFW_VERSION == '' }}
          tag: ${{ env.MAAFW_VERSION }}
          out-file-path: "deps/downloads/maafw"

      - name: Download MXU (win-x86_64)
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MXU
          fileName: "MXU-win-x86_64-*.zip"
          latest: ${{ env.MXU_VERSION == '' }}
          tag: ${{ env.MXU_VERSION }}
          out-file-path: "deps/downloads/mxu"

      - name: Download rcedit (icon patcher)
        uses: robinraju/release-downloader@v1
        with:
          repository: electron/rcedit
          fileName: "rcedit-x64.exe"
          latest: true
          out-file-path: "deps/tools"

      - name: Extract MaaFramework & MXU
        run: |
          mkdir -p deps/maafw deps/mxu
          unzip -q deps/downloads/maafw/*.zip -d deps/maafw
          unzip -q deps/downloads/mxu/*.zip -d deps/mxu

      - name: Fetch OCR models (MaaCommonAssets)
        run: python tools/configure.py

      - name: Assemble Windows MET distribution
        run: python tools/install.py "${{ needs.meta.outputs.tag }}"

      - name: Embed MET logo icon into MET.exe
        run: |
          python -m pip install --quiet pillow
          python -c "
          from PIL import Image
          img = Image.open('assets/logo.png').convert('RGBA')
          img.save('deps/logo.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          "
          ./deps/tools/rcedit-x64.exe install/MET.exe \
            --set-icon deps/logo.ico \
            --set-version-string ProductName "MET" \
            --set-version-string FileDescription "MET - Maa Eternal Tree"

      - name: Create release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "MET-win-x86_64-${{ needs.meta.outputs.tag }}.zip"
          Compress-Archive -Path "install\*" -DestinationPath "dist\$archive" -Force
          "ARCHIVE_NAME=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MET-win-x86_64-${{ needs.meta.outputs.tag }}
          path: dist/${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: needs.meta.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: MET ${{ needs.meta.outputs.tag }}
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: dist/${{ env.ARCHIVE_NAME }}
